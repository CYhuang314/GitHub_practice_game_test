name: Build and test on Windows, macOS and Linux
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test C rules
        run: sh scripts/build.sh --tests
      - name: Verify launchers, input, argument forwarding and paths with spaces
        run: node tests/test-launchers.mjs
  windows:
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, msvc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select compiler
        shell: pwsh
        run: |
          if ('${{ matrix.compiler }}' -eq 'msvc') {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $vcvars = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Auxiliary\Build\vcvars64.bat' | Select-Object -First 1
            if (-not $vcvars) { throw 'MSVC tools not found' }
            $lines = & $env:ComSpec /d /s /c ('call "' + $vcvars + '" >nul && set')
            if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
            foreach ($line in $lines) {
              if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
                "$($Matches[1].ToUpperInvariant())=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
            'CC=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            'CC=clang' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build and test C rules
        shell: pwsh
        run: ./scripts/build.ps1 -Tests
      - name: Verify CMD and Windows PowerShell launchers
        run: node tests/test-launchers.mjs
